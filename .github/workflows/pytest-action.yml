name: Pytest-check

on:
  push:
  pull_request:

jobs:
  run-test:
    name: Run code test
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Download packages using uv
        run: uv sync

      - name: Download local package
        run: uv pip install -e .

      - name: Run Pytest
        run: uv run pytest -vv
