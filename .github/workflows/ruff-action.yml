name: Linting

on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run Ruff checks
        run: uv run ruff check --exclude "*.ipynb" --exclude "notebooks/" --exclude "examples/"

      - name: Run Ruff format
        run: uv run ruff format --exclude "*.ipynb" --exclude "notebooks/" --exclude "examples/"
