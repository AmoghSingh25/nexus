# Config for GRN set to simulate SERGIO configuration
grn:
  ## Simulation related
  n_cells: 2700
  delta: 0.01
  n_steps: 10
  gene_data: "sample_data/Interaction_cID_4.txt"
  mr_data: "sample_data/Regs_cID_4.txt"
  config_file: ""
  logging: true
  learn_params: false
  epochs: 10
  lr: 1

  ## Gene related
  non_mr_basal: false
  noise: false
  noise_amplitude: 0.1
  decay:
    - 0.8
  hill_coeffs:
    - 1.0

  ## Protein related
  protein_sim: false
