# Config for GRN set to simulate SERGIO configuration
defaults:
  - _self_
grn:
  ## Simulation related
  n_cells: 2700
  delta: 0.01
  n_steps: 10
  gene_data: "configs/sample_data/Interaction_cID_4.txt"
  mr_data: "configs/sample_data/Regs_cID_4.txt"
  config_file: ""
  random_key: 42
  logging: false
  learn_params: false
  epochs: 10
  lr: 0.01

  ## Gene related
  non_mr_basal: false
  noise: false
  noise_amplitude: 0.1
  decay:
    - 0.8
  hill_coeffs:
    - 1.0

  ## Protein related
  protein_sim: false

spatial_sim:
  ## Mesh related
  height: 3
  width: 3
  depth: 3
  mesh_type: "grid"
  field_resolution: 2
  cell_concentration: 1
  field_vol: 1.0
  n_cell_type: 2

  ## Diffusion related
  D: 0.5
  diffusion_bool: true
  n_neighbours: 1

  ## Simulation Related
  delta: 0.01
  n_steps: 10
  random_key: 42
  logging: false
  log_dir: "logs"

  ## Movement related
  movement_bool: true
  movement:
    cell1:
      qty_ratio: 0.8
      attraction_coeff: 1
      repulsion_coeff: 0.1
      drift_vel_coeff: 0.01
      random_vel_coeff: 0.01
    cell2:
      qty_ratio: 0.2
      attraction_coeff: 2
      repulsion_coeff: 0.2
      drift_vel_coeff: 0.02
      random_vel_coeff: 0.05

  ## Cycle related
  cycle_bool: true
  cycle:
    cell1:
      cycle_len: 10
      interphase_len: 0.9
      necrosis_death_prob: 0.0001
      apoptosis_death_prob: 0.001
      cell_target_vol: 1.0
      cell_density: 1.0
      cell_vol_growth_rate: 1.0
      cell_decay_rate: 0.5
    cell2:
      cycle_len: 20
      interphase_len: 0.8
      necrosis_death_prob: 0.0001
      apoptosis_death_prob: 0.001
      cell_target_vol: 2.0
      cell_density: 2.0
      cell_vol_growth_rate: 1.5
      cell_decay_rate: 0.5

  ## Chemicals
  chemical:
    name:
      - "chem1"
      - "chem2"
      - "chem3"
    mol_mass:
      - 1
      - 2
      - 3

  ## Reactions
  reaction_bool: true
  reaction:
    reac_1:
      order: 2
      rate_coeff: 3
      reactants:
        - - "chem1"
          - 1
        - - "chem2"
          - 2
      products:
        - - "chem3"
          - 3
    reac_2: # Production of chemical
      order: 0
      rate_coeff: 1
      reactants:
      products:
        - - "chem3"
          - 3
    reac_3: # Decay of chemical
      order: 0
      rate_coeff: 1
      reactants:
        - - "chem2"
          - 3
      products:
