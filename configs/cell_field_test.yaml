# Config for GRN set to simulate SERGIO configuration with inter-field and reactions set to false
# Confirmation of cell-field diffusion
grn:
  ## Simulation related
  n_cells: 8
  delta: 0.01
  n_steps: 20
  config_file: "configs/sample_data/sample_network_1cell.yaml"
  random_key: 42
  logging: false
  
  ## Gene related
  non_mr_basal: false
  noise: true
  noise_amplitude: 0.1
  decay:
    - 0.8
  hill_coeffs:
    - 1.0

  ## Protein related
  protein_sim: false
  
# Lattice free setup
spatial_sim:
  ## Mesh related
  height: 2
  width: 2
  depth: 2
  mesh_type: "lattice-free"
  sparse_cells: true
  field_resolution: 2 # Divide into X divisions along each axis
  cell_concentration: 1 # Default value is 10
  field_vol: 1.0
  n_cell_type: 1
  cell_qty:
    cell1: 1.0

  ## Diffusion related
  D: 0.5
  diffusion_bool: false
  n_neighbours: 3
  
  ## Simulation Related
  delta: 0.01
  n_steps: 20
  random_key: 42
  logging: false
  debug_plot: false

  ## Movement related
  movement_bool: true
  movement:
    cell1:
      qty_ratio: 1.0
      attraction_coeff: 2
      repulsion_coeff: 0.1
      drift_vel_coeff: 0
      random_vel_coeff: 0

  ## Cycle related
  cycle_bool: false
  cycle:
    cell1:
      cycle_len: 10
      interphase_len: 0.9

      necrosis_death_prob: 0.1
      apoptosis_death_prob: 0.1
      cell_decay_rate: 0.5
      
      cell_target_vol: 10.0
      cell_density: 1.0
      cell_vol_growth_rate: 1.0
  
  ## Chemicals
  chemical:

  ## Reactions
  reaction_bool: false
  reaction_prob: false
  reaction: