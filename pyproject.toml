[project]
name = "nexusim"
version = "0.2.0"
description = "JAX-accelerated multi-scale simulator for biological control and causal discovery"
keywords = [
    "biology",
    "simulator",
    "jax",
    "causal-discovery",
    "multi-scale",
]
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
]
requires-python = ">=3.10"
dependencies = [
    "beartype>=0.22.9",
    "fastexcel>=0.16.0",
    "hydra-core>=1.3.2",
    "imageio>=2.37.2",
    "jax>=0.6.2",
    "jaxtyping>=0.3.7",
    "marimo>=0.17.0",
    "matplotlib>=3.10.7",
    "msgspec>=0.20.0",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "optax>=0.2.6",
    "polars>=1.34.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "tiledb>=0.35.2",
    "tqdm>=4.67.1",
]

[project.urls]
Homepage = "https://github.com/AmoghSingh25/nexus"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.0",
    "pre-commit>=4.3.0",
    "dash>=3.3.0",
    "dash-ag-grid>=32.3.2",
    "dash-bootstrap-components>=2.0.4",
    "flask-cors>=6.0.2",
    "diffrax>=0.7.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
exclude = ["notebooks/", "examples/"]

[tool.ruff.lint]
typing-modules = ["beartype.typing"]
ignore = ["F722"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.setuptools.package-dir]
nexus = "src/nexus"

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "tests*",
    "outputs*",
    "experiments*",
    "simulator.archive*",
    "*.egg-info*",
    "dashboard*"
]

[tool.setuptools.exclude-package-data]
simulator = ["archive/*", "outputs/*", "logs/*"]
outputs=["*"]
