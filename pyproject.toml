[project]
name = "nexus-sim"
version = "0.1.0a1"
description = "JAX-accelerated multi-scale simulator for biological control and causal discovery"
keywords = [
    "biology",
    "simulator",
    "jax",
    "causal-discovery",
    "multi-scale",
]
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
]
requires-python = ">=3.10"
dependencies = [
    "dash>=3.3.0",
    "dash-ag-grid>=32.3.2",
    "dash-bootstrap-components>=2.0.4",
    "fastexcel>=0.16.0",
    "flask-cors>=6.0.2",
    "flax>=0.10.7",
    "hydra-core>=1.3.2",
    "imageio>=2.37.2",
    "jax>=0.6.2",
    "marimo>=0.17.0",
    "matplotlib>=3.10.7",
    "msgspec>=0.20.0",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "optax>=0.2.6",
    "pandas>=2.3.3",
    "polars>=1.34.0",
    "pydeck>=0.9.1",
    "pympler>=1.1",
    "pyvista>=0.46.5",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "tiledb>=0.35.2",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.0",
    "pre-commit>=4.3.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
exclude = ["notebooks/", "examples/"]

[tool.setuptools.package-dir]
nexus = "src/nexus"

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "tests*",
    "outputs*",
    "experiments*",
    "simulator.archive*",
    "*.egg-info*",
    "dashboard*"
]

[tool.setuptools.exclude-package-data]
simulator = ["archive/*", "outputs/*", "logs/*"]
outputs=["*"]